// ── Profile system ──
const PROFILES_KEY='fv2_profiles';
const ACTIVE_KEY='fv2_active';

function getProfiles(){
 try{return JSON.parse(localStorage.getItem(PROFILES_KEY))||[];}catch{return[];}
}
function saveProfilesMeta(p){localStorage.setItem(PROFILES_KEY,JSON.stringify(p));}

let ACTIVE=localStorage.getItem(ACTIVE_KEY)||'';

function pfx(k){return ACTIVE&&ACTIVE!=='main'?`fv2_${ACTIVE}_${k}`:`fv2_${k}`;}
function ld(k,d){try{const v=localStorage.getItem(pfx(k));return v?JSON.parse(v):d;}catch{return d;}}
function sv(k,v){
 try{
  localStorage.setItem(pfx(k),JSON.stringify(v));
 }catch(e){
  if(e.name==='QuotaExceededError'||e.code===22){
   // Storage full — show emergency modal
   showStorageFullModal('data');
  }
 }
}

// Request persistent storage — makes data survive like native app
let _persistRequested=false;
async function requestPersistentStorage(){
 if(_persistRequested)return;
 _persistRequested=true;
 try{
  if(navigator.storage?.persist){
   const granted=await navigator.storage.persist();
   sv('storagePersisted',granted);
   return granted;
  }
 }catch{}
 return false;
}

// Emergency modal at 100% — blocks UI until user acts
function showStorageFullModal(context='photo'){
 // Don't stack modals
 if(document.getElementById('storageFullModal'))return;
 const modal=el('div',{id:'storageFullModal',
  style:{position:'fixed',inset:'0',zIndex:'9999',background:'rgba(0,0,0,.92)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',padding:'0'}
 });
 const box=el('div',{
  style:{background:'#1C1C28',borderRadius:'20px 20px 0 0',padding:'28px 24px 48px',width:'100%',maxWidth:'430px',border:'.5px solid rgba(255,59,48,.3)'}
 });
 box.appendChild(el('div',{style:{textAlign:'center',fontSize:'42px',marginBottom:'12px'}},'🔴'));
 box.appendChild(el('div',{style:{textAlign:'center',fontSize:'20px',fontWeight:'800',color:'#FF3B30',marginBottom:'8px'}},t().storFull||'Storage Full'));
 box.appendChild(el('div',{style:{textAlign:'center',fontSize:'14px',color:'rgba(255,255,255,.6)',marginBottom:'28px',lineHeight:'1.6'}}),
 );
 // Dynamic message
 const msg=context==='photo'
  ?'Cannot save receipt photo.\nYour transaction was saved.\n\nFree up space to continue using photos.'
  :'Cannot save transaction!\n\nFree up space immediately\nto prevent data loss.';
 box.children[2].textContent=msg;

 // Action 1: Clear photos now
 box.appendChild(el('button',{
  style:{width:'100%',background:'#FF3B30',border:'none',borderRadius:'14px',padding:'16px',color:'#fff',fontSize:'16px',fontWeight:'700',marginBottom:'12px',cursor:'pointer'},
  onClick:async()=>{
   if(_photoDB){
    await new Promise(res=>{
     const tx=_photoDB.transaction('photos','readwrite');
     tx.objectStore('photos').clear();
     tx.oncomplete=res;
    });
   }
   S.lastPurge=new Date().toISOString();persist();
   modal.remove();
   _storageStatus.checked=0; // Force recheck
   toast(l.photoClr||'Photos cleared ✓');
   render();
  }
 },'🗑 Clear All Photos Now'));

 // Action 2: Download backup
 box.appendChild(el('button',{
  style:{width:'100%',background:'rgba(255,255,255,.1)',border:'.5px solid rgba(255,255,255,.2)',borderRadius:'14px',padding:'14px',color:'#fff',fontSize:'15px',fontWeight:'600',marginBottom:'12px',cursor:'pointer'},
  onClick:()=>{backupJSON();modal.remove();}
 },'💾 Download Backup First'));

 // Action 3: Go to storage
 box.appendChild(el('button',{
  style:{width:'100%',background:'none',border:'none',color:'rgba(255,255,255,.5)',fontSize:'14px',cursor:'pointer',padding:'8px'},
  onClick:()=>{modal.remove();S.screen='storage';render();}
 },(t().manageStorage||'Manage Storage')+' →'));

 modal.appendChild(box);
 document.body.appendChild(modal);
}

// ── SHA-256 PIN hashing ──
async function hashPin(pin){
 const data=new TextEncoder().encode(pin+'fin_salt_gorvan27_v4');
 const buf=await crypto.subtle.digest('SHA-256',data);
 return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function verifyPin(entered,storedHash){
 // Backward compat: old plaintext PIN
 if(storedHash.length===4)return entered===storedHash;
 const h=await hashPin(entered);return h===storedHash;
}

// ── IndexedDB for photos ──
let _photoDB=null;
async function openPhotoDB(){
 if(_photoDB)return _photoDB;
 return new Promise((res,rej)=>{
  const req=indexedDB.open('fin_photos_v1',1);
  req.onupgradeneeded=e=>{
   const db=e.target.result;
   if(!db.objectStoreNames.contains('photos')){
    const s=db.createObjectStore('photos',{keyPath:'id'});
    s.createIndex('date','date');
   }
  };
  req.onsuccess=e=>{_photoDB=e.target.result;res(_photoDB);};
  req.onerror=()=>rej(req.error);
 });
}
async function savePhoto(id,base64){
 try{
  const db=await openPhotoDB();
  return new Promise(res=>{
   const tx=db.transaction('photos','readwrite');
   tx.objectStore('photos').put({id,data:base64,date:new Date().toISOString()});
   tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);
  });
 }catch{return false;}
}
async function getPhoto(id){
 try{
  const db=await openPhotoDB();
  return new Promise(res=>{
   const tx=db.transaction('photos','readonly');
   const req=tx.objectStore('photos').get(id);
   req.onsuccess=()=>res(req.result?.data||null);
   req.onerror=()=>res(null);
  });
 }catch{return null;}
}
async function deletePhoto(id){
 try{
  const db=await openPhotoDB();
  new Promise(res=>{
   const tx=db.transaction('photos','readwrite');
   tx.objectStore('photos').delete(id);
   tx.oncomplete=()=>res();
  });
 }catch{}
}
async function purgeOldPhotos(days=30){
 try{
  const db=await openPhotoDB();
  const cutoff=new Date(Date.now()-days*86400000).toISOString();
  return new Promise(res=>{
   const tx=db.transaction('photos','readwrite');
   const idx=tx.objectStore('photos').index('date');
   idx.openCursor(IDBKeyRange.upperBound(cutoff)).onsuccess=e=>{
    const cur=e.target.result;
    if(cur){cur.delete();cur.continue();}else res();
   };
  });
 }catch{}
}

// ── Image compression ──
function compressImage(file){
 return new Promise(res=>{
  const reader=new FileReader();
  reader.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    const MAX=900;
    const ratio=Math.min(MAX/Math.max(img.width,img.height),1.0);
    const canvas=document.createElement('canvas');
    canvas.width=Math.round(img.width*ratio);
    canvas.height=Math.round(img.height*ratio);
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    res(canvas.toDataURL('image/jpeg',0.72));
   };
   img.src=e.target.result;
  };
  reader.readAsDataURL(file);
 });
}

// ── PDF Monthly Report ──
async function generatePDF(month,year){
 const l=t(),c=ci();
 const txns=S.txns.filter(tx=>{
  const d=pd(tx.date);return d.getMonth()===month&&d.getFullYear()===year&&(tx.cur||'THB')===S.cur;
 });
 const totalInc=txns.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
 const totalExp=txns.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
 const cats=eCats().map(cat=>({
  ...cat,label:t().cats[cat.id]||cat.label||cat.id,
  v:txns.filter(tx=>tx.type==='expense'&&(tx.cat||tx.category)===cat.id).reduce((s,tx)=>s+tx.amount,0)
 })).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);

 const rows=txns.map(tx=>{
  const cat=gc(tx.type,tx.cat||tx.category);
  return `<tr style="border-bottom:1px solid #eee">
   <td style="padding:8px 12px;color:#666">${fd(tx.date,'en-US')}</td>
   <td style="padding:8px 12px">${cat.e} ${cat.label}</td>
   <td style="padding:8px 12px;color:#888">${tx.note||''}</td>
   <td style="padding:8px 12px;text-align:right;font-weight:600;color:${tx.type==='expense'?'#FF3B30':'#34C759'}">${tx.type==='expense'?'−':'+'}${fm(tx.amount,c.s)}</td>
  </tr>`;
 }).join('');

 const catRows=cats.map(cat=>`
  <div style="margin-bottom:10px">
   <div style="display:flex;justify-content:space-between;margin-bottom:4px">
    <span>${cat.e} ${cat.label}</span>
    <span style="font-weight:600">${fm(cat.v,c.s)} (${Math.round(cat.v/totalExp*100)}%)</span>
   </div>
   <div style="background:#f0f0f0;border-radius:4px;height:6px">
    <div style="background:#007AFF;height:6px;border-radius:4px;width:${Math.round(cat.v/totalExp*100)}%"></div>
   </div>
  </div>`).join('');

 const profileName=getProfiles().find(p=>p.id===ACTIVE)?.name||'Ivan';
 const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
 <title>Finance Report — ${l.months[month]} ${year}</title>
 <style>
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:700px;margin:40px auto;color:#111;padding:0 20px;}
  h1{font-size:28px;margin-bottom:4px}
  .sub{color:#888;margin-bottom:32px}
  .cards{display:flex;gap:16px;margin-bottom:32px}
  .card{flex:1;padding:20px;border-radius:16px;background:#f8f8f8}
  .card-v{font-size:24px;font-weight:700;margin-top:6px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:8px 12px;background:#f8f8f8;font-size:13px;color:#888}
  @media print{body{margin:20px}}
 </style></head><body>
 <h1>💰 Finance Report</h1>
 <div class="sub">${profileName} · ${l.months[month]} ${year} · ${c.c}</div>
 <div class="cards">
  <div class="card"><div style="color:#888;font-size:13px">INCOME</div><div class="card-v" style="color:#34C759">+${fm(totalInc,c.s)}</div></div>
  <div class="card"><div style="color:#888;font-size:13px">EXPENSES</div><div class="card-v" style="color:#FF3B30">−${fm(totalExp,c.s)}</div></div>
  <div class="card"><div style="color:#888;font-size:13px">BALANCE</div><div class="card-v" style="color:${totalInc-totalExp>=0?'#007AFF':'#FF3B30'}">${totalInc-totalExp>=0?'+':''}${fm(totalInc-totalExp,c.s)}</div></div>
 </div>
 <h2 style="margin-bottom:16px">Top Categories</h2>
 <div style="margin-bottom:32px">${catRows||'<p style="color:#888">No expenses this month</p>'}</div>
 <h2 style="margin-bottom:12px">Transactions (${txns.length})</h2>
 <table><thead><tr>
  <th>Date</th><th>Category</th><th>Note</th><th style="text-align:right">Amount</th>
 </tr></thead><tbody>${rows}</tbody></table>
 <div style="margin-top:32px;color:#bbb;font-size:12px;text-align:center">Generated by My Finances App · ${new Date().toLocaleDateString()}</div>
 </body></html>`;

 const win=window.open('','_blank');
 if(win){
  win.document.write(html);
  // Inject print script via DOM (safe — no closing tag inside JS string)
  const ps=win.document.createElement('script');
  ps.textContent='window.onload=()=>setTimeout(()=>window.print(),400)';
  win.document.head.appendChild(ps);
  win.document.close();
 }
 else toast('Allow popups to generate PDF',true);
}

// ── DOM HELPER ──
function el(tag,attrs,...kids){
 const e=document.createElement(tag);
 for(const[k,v] of Object.entries(attrs||{})){
  if(v===null||v===undefined||v===false)continue;
  if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
  else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);
  else if(k==='class')e.className=v;
  else e.setAttribute(k,v);
 }
 kids.flat(9).forEach(c=>{if(c!=null&&c!==false)e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});
 return e;
}

function lineChart(pts,color='#007AFF'){
 const hasD=pts.some(p=>p.v>0);
 if(!hasD)return el('div',{style:{textAlign:'center',color:'rgba(255,255,255,.3)',padding:'28px 0',fontSize:'14px'}},t().noData);
 const W=340,H=100,PL=42,PR=6,PT=8,PB=24,cw=W-PL-PR,ch=H-PT-PB;
 const mx=Math.max(...pts.map(p=>p.v),1);
 const tx=i=>PL+(i/(pts.length-1||1))*cw,ty=v=>PT+ch-(v/mx)*ch;
 const pD=pts.map((p,i)=>`${i?'L':'M'}${tx(i).toFixed(1)},${ty(p.v).toFixed(1)}`).join(' ');
 const aD=`${pD} L${tx(pts.length-1).toFixed(1)},${(PT+ch).toFixed(1)} L${PL},${(PT+ch).toFixed(1)} Z`;
 const yT=[0,Math.round(mx/2),mx];const step=Math.max(1,Math.floor(pts.length/5));
 let c=`<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
 yT.forEach(v=>{c+=`<line x1="${PL}" y1="${ty(v).toFixed(1)}" x2="${W-PR}" y2="${ty(v).toFixed(1)}" stroke="rgba(255,255,255,.05)" stroke-width="1"/><text x="${PL-4}" y="${(ty(v)+4).toFixed(1)}" text-anchor="end" fill="rgba(255,255,255,.3)" font-size="9">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`;});
 c+=`<path d="${aD}" fill="url(#lg)"/><path d="${pD}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
 pts.forEach((p,i)=>{if(p.v>0)c+=`<circle cx="${tx(i).toFixed(1)}" cy="${ty(p.v).toFixed(1)}" r="2.5" fill="${color}"/>`;});
 pts.filter((_,i)=>i%step===0||i===pts.length-1).forEach(p=>{const idx=pts.indexOf(p);c+=`<text x="${tx(idx).toFixed(1)}" y="${H-4}" text-anchor="middle" fill="rgba(255,255,255,.35)" font-size="9">${p.l}</text>`;});
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.setAttribute('height',H+'');svg.style.overflow='visible';svg.innerHTML=c;return svg;
}

function donut(segs,size=100){
 const tot=segs.reduce((s,x)=>s+x.v,0);
 if(!tot)return el('div',{style:{width:size+'px',height:size+'px'}});
 const r=36,circ=2*Math.PI*r;let off=0;
 let c=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="13"/>`;
 segs.forEach(s=>{const d=(s.v/tot)*circ;c+=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${s.color}" stroke-width="13" stroke-dasharray="${d} ${circ-d}" stroke-dashoffset="${-off}" style="transform:rotate(-90deg);transform-origin:50% 50%"/>`;off+=d;});
 // center total
 c+=`<text x="50" y="48" text-anchor="middle" fill="white" font-size="11" font-weight="700">${tot>=1000?(tot/1000).toFixed(1)+'k':Math.round(tot)}</text>`;
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('width',size+'');svg.setAttribute('height',size+'');svg.innerHTML=c;return svg;
}

 // Trend points
 let pts=[];
 if(S.tp==='day'){
  // last 14 days
  const today=new Date(ty,tm,now.getDate());
  pts=Array.from({length:14},(_,i)=>{
   const d=new Date(today);d.setDate(d.getDate()-(13-i));
   const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
   return{l:String(d.getDate()),v:curTxns.filter(tx=>tx.date===k).reduce((s,tx)=>s+tx.amount,0)};
  });
 } else if(S.tp==='week'){
  const today=new Date(ty,tm,now.getDate());
  pts=Array.from({length:7},(_,i)=>{
   const d=new Date(today);d.setDate(d.getDate()-(6-i));
   const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
   return{l:['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()],v:curTxns.filter(tx=>tx.date===k).reduce((s,tx)=>s+tx.amount,0)};
  });
 } else if(S.tp==='month'){
  const days=new Date(ty,tm+1,0).getDate();
  pts=Array.from({length:days},(_,i)=>{
   const day=i+1,k=ty+'-'+String(tm+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
   return{l:day%5===1||day===days?String(day):'',v:curTxns.filter(tx=>tx.date===k).reduce((s,tx)=>s+tx.amount,0)};
  });
 } else if(S.tp==='6m'){
  pts=Array.from({length:6},(_,i)=>{
   const d=new Date(ty,tm-(5-i),1),m=d.getMonth(),y=d.getFullYear();
   return{l:l.ms[m],v:curTxns.filter(tx=>{const td2=pd(tx.date);return td2.getMonth()===m&&td2.getFullYear()===y;}).reduce((s,tx)=>s+tx.amount,0)};
  });

   return{l:l.ms[m],v:curTxns.filter(tx=>{const td2=pd(tx.date);return td2.getMonth()===m&&td2.getFullYear()===y;}).reduce((s,tx)=>s+tx.amount,0)};

function screenPin(mode='unlock', onSuccess=null){
 // mode: 'unlock' | 'setup' | 'confirm'
 const l=t();
 let entered='';
 let firstPin=''; // for setup confirm

 const w=el('div',{style:{position:'fixed',inset:'0',background:'#0A0A0F',zIndex:'999',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 20px'}});

 const titleEl=el('div',{style:{fontSize:'22px',fontWeight:'700',color:'#fff',marginBottom:'8px'}},
  mode==='unlock'?l.pinTitle:mode==='setup'?l.pinSetup:l.pinConfirm
 );
 const subtitleEl=el('div',{style:{fontSize:'14px',color:'rgba(255,255,255,.4)',marginBottom:'40px'}},
  mode==='unlock'?'':mode==='setup'?'4 digits':l.pinConfirm
 );

 // Dots display
 const dotsWrap=el('div',{style:{display:'flex',gap:'16px',marginBottom:'40px'}});
 const dots=Array.from({length:4},()=>{
  const d=el('div',{style:{width:'16px',height:'16px',borderRadius:'50%',background:'rgba(255,255,255,.15)',border:'.5px solid rgba(255,255,255,.2)',transition:'background .15s'}});
  dotsWrap.appendChild(d);return d;
 });

 const errorEl=el('div',{style:{fontSize:'14px',color:'#FF3B30',marginBottom:'16px',minHeight:'20px',textAlign:'center'}});

 const updateDots=()=>dots.forEach((d,i)=>d.style.background=i<entered.length?'#007AFF':'rgba(255,255,255,.15)');

 const submit=()=>{
  if(mode==='unlock'){
   // Rate limiting: max 5 attempts, then 30s lockout
   const attempts=parseInt(sessionStorage.getItem('pin_attempts')||'0');
   const lockUntil=parseInt(sessionStorage.getItem('pin_lock_until')||'0');

   if(Date.now()<lockUntil){
    const secs=Math.ceil((lockUntil-Date.now())/1000);
    errorEl.textContent=`🔒 Locked. Wait ${secs}s`;
    entered='';updateDots();
    return;
   }

   verifyPin(entered,S.pin).then(correct=>{
    if(correct){
     sessionStorage.removeItem('pin_attempts');sessionStorage.removeItem('pin_lock_until');
     S.pinLocked=false;
     document.getElementById('pinScreen')?.remove();
     if(onSuccess)onSuccess();else render();
    } else {
     const newAttempts=attempts+1;
     sessionStorage.setItem('pin_attempts',String(newAttempts));
     entered='';updateDots();
     if(newAttempts>=5){
      const lockUntilTime=Date.now()+30000;
      sessionStorage.setItem('pin_lock_until',String(lockUntilTime));
      sessionStorage.setItem('pin_attempts','0');
      errorEl.textContent='🔒 Too many attempts. Locked 30s';
      const countdown=setInterval(()=>{
       const rem=Math.ceil((lockUntilTime-Date.now())/1000);
       if(rem<=0){clearInterval(countdown);errorEl.textContent='';}
       else errorEl.textContent=`🔒 Locked. Wait ${rem}s`;
      },1000);
     } else {
      const left=5-newAttempts;
      errorEl.textContent=`${l.pinWrong} · ${left} attempt${left===1?'':'s'} left`;
      setTimeout(()=>errorEl.textContent='',2000);
     }
    }
   });
  } else if(mode==='setup'){
   firstPin=entered;entered='';updateDots();
   titleEl.textContent=l.pinConfirm;subtitleEl.textContent='';
   // switch to confirm mode internally
   submitHandler=confirmHandler;
  } else if(mode==='confirm'){
   if(entered===firstPin){
    hashPin(entered).then(hash=>{S.pin=hash;persist();toast(l.pinEnabled);w.remove();if(onSuccess)onSuccess();});
   }
   else{entered='';updateDots();errorEl.textContent=l.pinMismatch;setTimeout(()=>errorEl.textContent='',1500);}
  }
 };

 let confirmHandler=()=>{
  if(entered===firstPin){
   hashPin(entered).then(hash=>{
    S.pin=hash;persist();toast(l.pinEnabled);w.remove();if(onSuccess)onSuccess();
   });
  }
  else{entered='';updateDots();errorEl.textContent=l.pinMismatch;setTimeout(()=>errorEl.textContent='',1500);}
 };
 let submitHandler=submit;

 // Numpad
 const numpad=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,72px)',gap:'12px'}});
 [1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(key=>{
  if(key===''){numpad.appendChild(el('div',{}));return;}
  const btn=el('button',{
   style:{width:'72px',height:'72px',borderRadius:'50%',background:key==='⌫'?'transparent':'rgba(255,255,255,.08)',border:key==='⌫'?'none':'.5px solid rgba(255,255,255,.1)',color:'#fff',fontSize:key==='⌫'?'24px':'22px',fontWeight:'500',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit'},
   onClick:()=>{
    if(key==='⌫'){if(entered.length>0){entered=entered.slice(0,-1);updateDots();}}
    else{if(entered.length<4){entered+=String(key);updateDots();if(entered.length===4)setTimeout(()=>submitHandler(),120);}}
   }
  },String(key));
  numpad.appendChild(btn);
 });

 // Cancel/skip button
 const cancelBtn=mode!=='unlock'?el('button',{style:{marginTop:'28px',background:'none',border:'none',color:'rgba(255,255,255,.4)',fontSize:'15px',cursor:'pointer'},onClick:()=>w.remove()},l.pinSkip):el('span',{});

 w.appendChild(titleEl);w.appendChild(subtitleEl);w.appendChild(dotsWrap);w.appendChild(errorEl);w.appendChild(numpad);w.appendChild(cancelBtn);
 w.id='pinScreen';
 return w;
}

// ── Storage protection system ──
// Cached storage status, updated on open and before each photo save
let _storageStatus={pct:0,quota:0,usage:0,checked:0};

async function checkStorageStatus(){
 // Cache for 60 seconds
 if(Date.now()-_storageStatus.checked<60000)return _storageStatus;
 try{
  const est=await navigator.storage?.estimate?.()??{usage:0,quota:0};
  const pct=est.quota>0?(est.usage/est.quota)*100:0;
  _storageStatus={pct,quota:est.quota||0,usage:est.usage||0,checked:Date.now()};
 }catch{_storageStatus={pct:0,quota:0,usage:0,checked:Date.now()};}
 return _storageStatus;
}

// Call on startup — check and warn if needed
async function startupStorageCheck(){
 await smartPurge();
 // Request persistent storage (makes data survive like native app)
 requestPersistentStorage();
 const status=await checkStorageStatus();
 if(status.pct>=90){
  S._storageAlert='critical';
 } else if(status.pct>=70){
  S._storageAlert='warning';
 } else {
  S._storageAlert=null;
 }
}

// Before saving a photo — check available space
async function canSavePhoto(){
 const status=await checkStorageStatus();
 const pct=status.pct;

 // 100%: hard block + emergency modal
 if(pct>=98){
  showStorageFullModal('photo');
  return false;
 }

 // 85–98%: soft block with actionable toast
 if(pct>=85){
  const free=fmtBytes(status.quota-status.usage);
  // Show inline blocking message (not modal yet)
  const modal=el('div',{
   style:{position:'fixed',inset:'0',zIndex:'2000',background:'rgba(0,0,0,.85)',display:'flex',alignItems:'flex-end',justifyContent:'center'}
  });
  const box=el('div',{style:{background:'#1C1C28',borderRadius:'20px 20px 0 0',padding:'24px 20px 44px',width:'100%',maxWidth:'430px',border:'.5px solid rgba(255,149,0,.3)'}});
  box.appendChild(el('div',{style:{textAlign:'center',fontSize:'32px',marginBottom:'10px'}},'⚠️'));
  box.appendChild(el('div',{style:{fontSize:'17px',fontWeight:'700',textAlign:'center',marginBottom:'8px',color:'#FF9500'}},t().storAlmost||'Storage Almost Full'));
  box.appendChild(el('div',{style:{fontSize:'13px',color:'rgba(255,255,255,.6)',textAlign:'center',marginBottom:'20px'}}),);
  box.children[2].textContent=`${pct.toFixed(0)}% used · Only ${free} left\nPhoto not saved. Free space to continue.`;
  box.appendChild(el('button',{
   style:{width:'100%',background:'#FF9500',border:'none',borderRadius:'12px',padding:'14px',color:'#fff',fontSize:'15px',fontWeight:'600',marginBottom:'10px'},
   onClick:()=>{modal.remove();S.screen='storage';render();}
  },'Go to Storage →'));
  box.appendChild(el('button',{
   style:{width:'100%',background:'none',border:'none',color:'rgba(255,255,255,.4)',fontSize:'14px',cursor:'pointer'},
   onClick:()=>modal.remove()
  },t().dismiss||'Dismiss'));
  modal.appendChild(box);
  document.body.appendChild(modal);
  return false;
 }

 // 70–85%: allow but warn (especially if Never is set)
 if(pct>=70&&S.storageClearDays===0){
  toast(`⚠️ Storage ${pct.toFixed(0)}% full — enable auto-clear in Settings`,true);
 }
 return true;
}

async function smartPurge(){
 if(S.storageClearDays===0)return; // Never
 const now=Date.now();
 const lastP=S.lastPurge?new Date(S.lastPurge).getTime():0;
 if(now-lastP<86400000)return; // Already ran today
 await purgeOldPhotos(S.storageClearDays);
 S.lastPurge=new Date().toISOString();
 persist();
}

// Count photos in IndexedDB and their total size
async function getPhotoStats(){
 try{
  const db=await openPhotoDB();
  return new Promise(res=>{
   const tx=db.transaction('photos','readonly');
   const req=tx.objectStore('photos').getAll();
   req.onsuccess=()=>{
    const photos=req.result||[];
    const totalBytes=photos.reduce((s,p)=>s+Math.round((p.data||'').length*0.75),0);
    res({count:photos.length,bytes:totalBytes});
   };
   req.onerror=()=>res({count:0,bytes:0});
  });
 }catch{return{count:0,bytes:0};}
}

function fmtBytes(b){
 if(b<1024)return b+'B';
 if(b<1048576)return(b/1024).toFixed(1)+'KB';
 return(b/1048576).toFixed(1)+'MB';
}

 const grid=el('div',{style:{display:'flex',flexDirection:'column',gap:'12px',width:'100%',maxWidth:'320px'}});

 });

function selectProfile(id){
 ACTIVE=id;
 localStorage.setItem(ACTIVE_KEY,id);
 // Reload state for this profile
 S.txns=ld('t',[]);S.budgets=ld('b',{});S.custom=ld('c',[]);
 S.goals=ld('g',[]);S.wallets=ld('w',DEF_WALLETS);S.templates=ld('tpl',[]);
 S.cur=ld('cur','THB');S.lang=ld('lang','en');
 S.sheetsUrl=ld('su','');S.sheetsSync=ld('ss',true);
 S.pin=ld('pin','');
 S.screen='home';S.pinLocked=!!S.pin;
 render();
}

function showAddProfileSheet(){
 let name='',emoji='👤',color='#007AFF';
 const EMOJIS=['👨','👩','🧑','👦','👧','🧔','👱','🙋'];
 const COLORS=['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#FF2D55'];

 const prev=document.body.style.overflow;document.body.style.overflow='hidden';
 const ov=el('div',{style:{position:'fixed',inset:'0',zIndex:'500',display:'flex',flexDirection:'column',justifyContent:'flex-end'}});
 ov.appendChild(el('div',{style:{flex:'1',background:'rgba(0,0,0,.7)'},onClick:()=>{document.body.style.overflow=prev;ov.remove();}}));
 const sh=el('div',{style:{background:'#1C1C28',borderRadius:'20px 20px 0 0',padding:'0 0 48px',border:'.5px solid rgba(255,255,255,.1)'}});
 sh.appendChild(el('div',{style:{width:'36px',height:'4px',background:'rgba(255,255,255,.2)',borderRadius:'2px',margin:'14px auto 0'}}));
 sh.appendChild(el('div',{style:{textAlign:'center',fontSize:'17px',fontWeight:'700',padding:'12px 20px 16px',borderBottom:'.5px solid rgba(255,255,255,.08)'}},t().newPrf||'New Profile'));

 const nameInp=el('input',{type:'text',placeholder:'Name (e.g. Nita)',maxlength:'16',
  style:{width:'100%',background:'rgba(255,255,255,.08)',border:'.5px solid rgba(255,255,255,.1)',borderRadius:'12px',padding:'12px 16px',color:'#fff',fontSize:'16px',margin:'16px 20px 0',width:'calc(100% - 40px)',fontFamily:'inherit',outline:'none'}});
 nameInp.addEventListener('input',e=>{name=e.target.value;});
 sh.appendChild(nameInp);

 sh.appendChild(el('div',{style:{fontSize:'11px',color:'rgba(255,255,255,.4)',padding:'14px 20px 8px',textTransform:'uppercase',letterSpacing:'.5px'}},'Avatar'));
 const emojiRow=el('div',{style:{display:'flex',gap:'8px',padding:'0 20px 16px',overflowX:'auto'}});
 EMOJIS.forEach(em=>{
  const btn=el('button',{style:{width:'44px',height:'44px',borderRadius:'12px',background:emoji===em?'#007AFF':'rgba(255,255,255,.07)',border:'.5px solid rgba(255,255,255,.08)',fontSize:'22px',flexShrink:'0'},
   onClick:()=>{emoji=em;emojiRow.querySelectorAll('button').forEach(b=>b.style.background='rgba(255,255,255,.07)');btn.style.background='#007AFF';}
  },em);
  emojiRow.appendChild(btn);
 });
 sh.appendChild(emojiRow);

 sh.appendChild(el('div',{style:{fontSize:'11px',color:'rgba(255,255,255,.4)',padding:'0 20px 8px',textTransform:'uppercase',letterSpacing:'.5px'}},'Color'));
 const colorRow=el('div',{style:{display:'flex',gap:'10px',padding:'0 20px 20px'}});
 COLORS.forEach(clr=>{
  colorRow.appendChild(el('div',{style:{width:'32px',height:'32px',borderRadius:'50%',background:clr,cursor:'pointer',border:color===clr?'3px solid #fff':'3px solid transparent'},
   onClick:()=>{color=clr;colorRow.querySelectorAll('div').forEach(d=>d.style.border='3px solid transparent');event.currentTarget.style.border='3px solid #fff';}
  }));
 });
 sh.appendChild(colorRow);

 sh.appendChild(el('div',{style:{padding:'0 20px'}},
  el('button',{
   style:{width:'100%',background:'#007AFF',border:'none',borderRadius:'14px',padding:'14px',color:'#fff',fontSize:'16px',fontWeight:'600'},
   onClick:()=>{
    if(!name.trim()){nameInp.style.borderColor='#FF3B30';return;}
    const id=name.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now();
    const profiles=getProfiles();
    profiles.push({id,name:name.trim(),emoji,color});
    saveProfilesMeta(profiles);
    document.body.style.overflow=prev;ov.remove();
    render();
   }
  },t().createPrf||'Create Profile')
 ));
 ov.appendChild(sh);document.body.appendChild(ov);
 setTimeout(()=>nameInp.focus(),100);
}

function render(){
 const app=document.getElementById('app');app.innerHTML='';const l=t();

 // First run: no profiles → show creation screen
 let profiles=getProfiles();
 if(profiles.length===0){
  app.appendChild(screenFirstRun());
  return;
 }

 // No active profile → show selector
 if(!ACTIVE){
  app.appendChild(screenProfileSelect());
  return;
 }

 // PIN lock
 if(S.pin&&S.pinLocked){
  document.body.style.overflow='hidden';
  app.appendChild(screenPin('unlock',()=>{document.body.style.overflow='';S.pinLocked=false;render();}));
  return;
 }

 document.body.style.overflow=S.screen==='add'?'hidden':'';
 const map={home:screenHome,history:screenHistory,analytics:screenAnalytics,budget:screenBudget,addCat:screenAddCat,manageCats:screenManageCats,addWallet:screenAddWallet,addTemplate:screenAddTemplate,goals:screenGoals,settings:screenSettings,add:screenAdd};

 // Storage screen is async (reads IndexedDB)
 if(S.screen==='storage'){
  const placeholder=el('div',{class:'screen'},
   el('div',{class:'ph'},
    el('button',{style:{background:'none',border:'none',color:'#007AFF',fontSize:'16px',cursor:'pointer'},onClick:()=>{S.screen='settings';render();}},'← '+t().sett),
    el('div',{class:'pt'},'Storage'),el('div',{})
   ),
   el('div',{style:{textAlign:'center',padding:'60px 20px',color:'rgba(255,255,255,.4)',fontSize:'14px'}},'⏳ Loading...')
  );
  app.appendChild(placeholder);
  screenStorage().then(screen=>{app.replaceChild(screen,placeholder);});
  // Nav still needed
  const nav2=el('nav',{class:'nb'});
  [{id:'home',e:'🏠',lb:t().home},{id:'history',e:'📋',lb:t().hist},{id:'analytics',e:'📊',lb:t().anal},{id:'goals',e:'🎯',lb:t().goalsN},{id:'settings',e:'⚙️',lb:t().sett}].forEach(n=>{
   nav2.appendChild(el('button',{class:'ni',onClick:()=>{S.screen=n.id;render();}},el('span',{style:{fontSize:'20px',opacity:'0.35'}},n.e),el('span',{style:{fontSize:'9px',color:'rgba(255,255,255,.35)'}},n.lb)));
  });
  app.appendChild(nav2);
  return;
 }
 app.appendChild((map[S.screen]||screenHome)());
 const noFab=new Set(['add','addCat','addWallet','addTemplate','manageCats']);
 if(!noFab.has(S.screen)){
  app.appendChild(el('button',{class:'fab',onClick:()=>{S.form={type:'expense',amt:'',cat:'',note:'',tags:'',date:td(),cur:S.cur,walletId:'',receipt:null};S.screen='add';render();}},'+'));
 }
 const nav=el('nav',{class:'nb'});
 const noNav=new Set(['add','addCat','addWallet','addTemplate','manageCats']);
 if(!noNav.has(S.screen)){
  [{id:'home',e:'🏠',lb:l.home},{id:'history',e:'📋',lb:l.hist},{id:'analytics',e:'📊',lb:l.anal},{id:'goals',e:'🎯',lb:l.goalsN},{id:'settings',e:'⚙️',lb:l.sett}].forEach(n=>{
   const active=S.screen===n.id||( n.id==='budget'&&(S.screen==='addCat'||S.screen==='addWallet'||S.screen==='addTemplate'));
   nav.appendChild(el('button',{class:'ni',onClick:()=>{S.screen=n.id;render();}},el('span',{style:{fontSize:'20px',opacity:active?'1':'.35'}},n.e),el('span',{style:{fontSize:'9px',color:active?'#007AFF':'rgba(255,255,255,.35)',fontWeight:active?'600':'400'}},n.lb)));
  });
  app.appendChild(nav);
 }
}

if(S.pin) S.pinLocked=true;
// Storage check: smart purge + warn if filling up
startupStorageCheck().then(()=>render());
// Initial render (before async check completes)
render();
</script>
<script>
// Service Worker с версионированием — при обновлении файла кэш сбрасывается автоматически
if('serviceWorker' in navigator){
  const CACHE_VERSION='finances-v4-20260513'; // Меняй при каждом деплое
  const swCode=`
const CACHE='${`finances-v4-20260513`}';
const FILE=location.pathname;

self.addEventListener('install',e=>{
  e.waitUntil(
    caches.open(CACHE).then(c=>c.add(FILE)).catch(()=>{})
  );
  self.skipWaiting();
});

self.addEventListener('activate',e=>{
  // Удаляем все старые версии кэша
  e.waitUntil(
    caches.keys().then(keys=>Promise.all(
      keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))
    )).then(()=>clients.claim())
  );
});

self.addEventListener('fetch',e=>{
  // Network-first: всегда пробуем сеть, кэш только при офлайне
  e.respondWith(
    fetch(e.request).then(res=>{
      if(res.ok){
        const clone=res.clone();
        caches.open(CACHE).then(c=>c.put(e.request,clone));
      }
      return res;
    }).catch(()=>caches.match(e.request).then(r=>r||caches.match(FILE)))
  );
});
`;
  try{
    const blob=new Blob([swCode],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    navigator.serviceWorker.register(url,{scope:'./'})
      .then(reg=>{
        // Принудительно проверяем обновление при каждом открытии
        reg.update();
      })
      .catch(()=>{});
  }catch(e){}
}
</script>
