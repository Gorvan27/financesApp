<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0A0A0F;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;max-width:430px;margin:0 auto;min-height:100vh;overscroll-behavior:none;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5;}
input[type=file]{display:none;}
select{-webkit-appearance:none;appearance:none;color:#fff;}
textarea{font-family:inherit;resize:none;}
::-webkit-scrollbar{display:none;}
button{cursor:pointer;font-family:inherit;}
/* ── Layout ── */
.screen{padding-top:54px;padding-bottom:110px;min-height:100vh;background:#0A0A0F;}
.ph{padding:6px 20px 14px;display:flex;align-items:center;justify-content:space-between;}
.pt{font-size:28px;font-weight:700;letter-spacing:-.5px;color:#fff;}
/* ── Cards — контрастный фон ── */
.card{background:#1C1C28;border-radius:18px;overflow:hidden;margin:0 16px 14px;border:.5px solid rgba(255,255,255,.07);}
.row{display:flex;align-items:center;padding:13px 16px;border-bottom:.5px solid rgba(255,255,255,.07);gap:12px;}
.row:last-child{border-bottom:none;}
/* ── Section header ── */
.sh{font-size:12px;font-weight:700;color:rgba(255,255,255,.35);padding:14px 20px 8px;text-transform:uppercase;letter-spacing:.8px;}
/* ── Inputs ── */
.inp{background:rgba(255,255,255,.09);border:.5px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 16px;color:#fff;font-size:15px;width:100%;font-family:inherit;outline:none;}
.inp:focus{border-color:rgba(0,122,255,.6);}
/* ── Buttons ── */
.cb{background:rgba(255,255,255,.12);border:.5px solid rgba(255,255,255,.1);border-radius:20px;padding:6px 13px;color:#fff;font-size:14px;display:flex;align-items:center;gap:6px;}
.fab{position:fixed;bottom:82px;right:calc(50% - 210px);background:#007AFF;border:none;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,122,255,.5);z-index:99;font-size:30px;color:#fff;}
/* ── Navbar ── */
.nb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,15,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:.5px solid rgba(255,255,255,.12);display:flex;padding:10px 0 22px;z-index:100;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;color:#fff;padding:4px 0;}
/* ── Settings rows ── */
.sr{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:.5px solid rgba(255,255,255,.07);cursor:pointer;}
.sr:last-child{border-bottom:none;}
/* ── Toast ── */
.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#2C2C3A;border:.5px solid rgba(255,255,255,.15);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:2000;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.5);display:none;}
.toast.e{background:#FF3B30;}
/* ── Sheets / overlays ── */
.ovl{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;justify-content:flex-end;}
.obg{flex:1;background:rgba(0,0,0,.7);}
.sht{background:#1C1C28;border-radius:20px 20px 0 0;padding-bottom:44px;max-height:85vh;overflow-y:auto;border-top:.5px solid rgba(255,255,255,.1);}
.hdl{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:14px auto 0;}
.stl{text-align:center;font-size:17px;font-weight:700;padding:12px 20px 14px;border-bottom:.5px solid rgba(255,255,255,.08);}
/* ── Segment control ── */
.seg{display:flex;background:rgba(255,255,255,.09);border-radius:10px;padding:3px;gap:3px;border:.5px solid rgba(255,255,255,.08);}
.sb{flex:1;border:none;border-radius:8px;padding:8px 4px;color:#fff;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s;}
/* ── Category grid ── */
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.ci{background:#252532;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:background .15s;border:.5px solid rgba(255,255,255,.06);}
.ci:active{opacity:.7;}
/* ── Progress bars ── */
.pb{background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;transition:width .3s;}
/* ── Toggle ── */
.tgl{width:50px;height:28px;border-radius:14px;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0;}
.tgl-k{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .3s;box-shadow:0 1px 4px rgba(0,0,0,.3);}
/* ── Wallet chips ── */
.wchip{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
/* ── Template chips ── */
.tchip{display:flex;flex-direction:column;align-items:center;padding:10px 8px;background:#252532;border-radius:14px;border:.5px solid rgba(255,255,255,.07);color:#fff;cursor:pointer;font-family:inherit;min-width:70px;}
/* ── Daily widget ── */
.dw{margin:0 16px 14px;background:linear-gradient(135deg,#12122A 0%,#0D1B2A 100%);border-radius:18px;padding:14px 16px;border:.5px solid rgba(255,255,255,.1);}
/* ── Comparison ── */
.cmp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cmp-bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
/* ── Form card ── */
.fcard{background:#1C1C28;border-radius:18px;margin:0 16px 14px;overflow:hidden;border:.5px solid rgba(255,255,255,.09);}
.frow{padding:10px 18px 12px;border-bottom:.5px solid rgba(255,255,255,.07);}
.frow:last-child{border-bottom:none;}
.flabel{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:4px;font-weight:500;}
.ftxt{width:100%;background:transparent;border:none;font-size:15px;color:#fff;outline:none;font-family:inherit;}
</style>

function td(){return new Date().toISOString().slice(0,10);}
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fd(s,lo){try{return pd(s).toLocaleDateString(lo,{day:'numeric',month:'short'});}catch{return s;}}
function fm(n,sym){return sym+new Intl.NumberFormat('en-US').format(Math.abs(Math.round(n*100)/100));}
let _i=0;function mid(){return Date.now()+'_'+(++_i);}
function t(){return L[S.lang]||L.en;}
function ci(){return CURS.find(c=>c.c===S.cur)||CURS[0];}
function eCats(){return[...EC,...S.custom.filter(c=>c.type==='expense')];}
function iCats(){return[...IC,...S.custom.filter(c=>c.type==='income')];}
function gc(type,id){const a=type==='expense'?eCats():iCats();const b=a.find(c=>c.id===id);if(!b)return{e:'📦',label:id};return{e:b.e||'📦',label:t().cats[b.id]||b.label||b.id};}
function gw(id){return S.wallets.find(w=>w.id===id)||null;}

function persist(){

function filterTxns(m,y,cur,walletId){
 return S.txns.filter(tx=>{
  const d=pd(tx.date);
  const mOk=d.getMonth()===m&&d.getFullYear()===y;
  const cOk=(tx.cur||'THB')===cur;
  const wOk=!walletId||walletId==='all'||(tx.walletId||'')=== walletId;
  return mOk&&cOk&&wOk;
 });
}
function sum(a,type){return a.filter(x=>x.type===type).reduce((s,x)=>s+x.amount,0);}

let toastT;

// ── DOM HELPER ──
function el(tag,attrs,...kids){
 const e=document.createElement(tag);
 for(const[k,v] of Object.entries(attrs||{})){
  if(v===null||v===undefined||v===false)continue;
  if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
  else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);
  else if(k==='class')e.className=v;
  else e.setAttribute(k,v);
 }
 kids.flat(9).forEach(c=>{if(c!=null&&c!==false)e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});
 return e;
}

function lineChart(pts,color='#007AFF'){
 const hasD=pts.some(p=>p.v>0);
 if(!hasD)return el('div',{style:{textAlign:'center',color:'rgba(255,255,255,.3)',padding:'28px 0',fontSize:'14px'}},t().noData);
 const W=340,H=100,PL=42,PR=6,PT=8,PB=24,cw=W-PL-PR,ch=H-PT-PB;
 const mx=Math.max(...pts.map(p=>p.v),1);
 const tx=i=>PL+(i/(pts.length-1||1))*cw,ty=v=>PT+ch-(v/mx)*ch;
 const pD=pts.map((p,i)=>`${i?'L':'M'}${tx(i).toFixed(1)},${ty(p.v).toFixed(1)}`).join(' ');
 const aD=`${pD} L${tx(pts.length-1).toFixed(1)},${(PT+ch).toFixed(1)} L${PL},${(PT+ch).toFixed(1)} Z`;
 const yT=[0,Math.round(mx/2),mx];const step=Math.max(1,Math.floor(pts.length/5));
 let c=`<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
 yT.forEach(v=>{c+=`<line x1="${PL}" y1="${ty(v).toFixed(1)}" x2="${W-PR}" y2="${ty(v).toFixed(1)}" stroke="rgba(255,255,255,.05)" stroke-width="1"/><text x="${PL-4}" y="${(ty(v)+4).toFixed(1)}" text-anchor="end" fill="rgba(255,255,255,.3)" font-size="9">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`;});
 c+=`<path d="${aD}" fill="url(#lg)"/><path d="${pD}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
 pts.forEach((p,i)=>{if(p.v>0)c+=`<circle cx="${tx(i).toFixed(1)}" cy="${ty(p.v).toFixed(1)}" r="2.5" fill="${color}"/>`;});
 pts.filter((_,i)=>i%step===0||i===pts.length-1).forEach(p=>{const idx=pts.indexOf(p);c+=`<text x="${tx(idx).toFixed(1)}" y="${H-4}" text-anchor="middle" fill="rgba(255,255,255,.35)" font-size="9">${p.l}</text>`;});
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.setAttribute('height',H+'');svg.style.overflow='visible';svg.innerHTML=c;return svg;
}

function donut(segs,size=100){
 const tot=segs.reduce((s,x)=>s+x.v,0);
 if(!tot)return el('div',{style:{width:size+'px',height:size+'px'}});
 const r=36,circ=2*Math.PI*r;let off=0;
 let c=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="13"/>`;
 segs.forEach(s=>{const d=(s.v/tot)*circ;c+=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${s.color}" stroke-width="13" stroke-dasharray="${d} ${circ-d}" stroke-dashoffset="${-off}" style="transform:rotate(-90deg);transform-origin:50% 50%"/>`;off+=d;});
 // center total
 c+=`<text x="50" y="48" text-anchor="middle" fill="white" font-size="11" font-weight="700">${tot>=1000?(tot/1000).toFixed(1)+'k':Math.round(tot)}</text>`;
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('width',size+'');svg.setAttribute('height',size+'');svg.innerHTML=c;return svg;
}

 // Trend points
 let pts=[];

  const today=new Date(ty,tm,now.getDate());

   const d=new Date(today);d.setDate(d.getDate()-(13-i));
   const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
   return{l:String(d.getDate()),v:curTxns.filter(tx=>tx.date===k).reduce((s,tx)=>s+tx.amount,0)};

  const today=new Date(ty,tm,now.getDate());

   const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
   return{l:['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()],v:curTxns.filter(tx=>tx.date===k).reduce((s,tx)=>s+tx.amount,0)};
  });

  pts=Array.from({length:days},(_,i)=>{

   return{l:day%5===1||day===days?String(day):'',v:curTxns.filter(tx=>tx.date===k).reduce((s,tx)=>s+tx.amount,0)};

 } else if(S.tp==='6m'){
  pts=Array.from({length:6},(_,i)=>{
   const d=new Date(ty,tm-(5-i),1),m=d.getMonth(),y=d.getFullYear();

 ));

 // Trend chart
 w.appendChild(el('div',{class:'sh'},l.trend));

<script>
// Регистрируем Service Worker для offline-режима
if('serviceWorker' in navigator){
  // Inline SW через Blob — работает с file:// и GitHub Pages
  const swCode=`
const CACHE='finances-v1';
const FILE=location.pathname;
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.add(FILE)).catch(()=>{}));
  self.skipWaiting();
});
self.addEventListener('activate',e=>{
  e.waitUntil(clients.claim());
});
self.addEventListener('fetch',e=>{
  e.respondWith(
    caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
      const clone=res.clone();
      caches.open(CACHE).then(c=>c.put(e.request,clone));
      return res;
    }).catch(()=>caches.match(FILE)))
  );
});
`;
  try{
    const blob=new Blob([swCode],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    navigator.serviceWorker.register(url,{scope:'./'}).catch(()=>{});
  }catch(e){}
}
</script>
