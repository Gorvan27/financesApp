app = "shop-accountant"
primary_region = "sin"

[build]

[env]
  DRY_RUN = "1"
  CATEGORY = "DJ Shop"
  CLAUDE_MODEL = "claude-sonnet-5-5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # пачки ждут в памяти — машина не должна засыпать
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "shopbot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
